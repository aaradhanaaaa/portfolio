<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Message Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f1e;
      color: #eef4ff;
      min-height: 100vh;
    }

    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .admin-header h1 {
      font-size: 2rem;
      background: linear-gradient(90deg, #f9e25e, #fff5c4);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }

    .refresh-btn {
      padding: 10px 20px;
      background: rgba(139, 92, 246, 0.9);
      border: 1px solid rgba(139, 92, 246, 0.5);
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .refresh-btn:hover {
      background: rgba(139, 92, 246, 1);
      transform: translateY(-2px);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      text-align: center;
    }

    .stat-card h3 {
      color: #f9e25e;
      margin-bottom: 10px;
    }

    .stat-card .value {
      font-size: 2.5rem;
      font-weight: 700;
    }

    .messages-grid {
      display: grid;
      gap: 20px;
    }

    .message-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.25s ease;
    }

    .message-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(139, 92, 246, 0.4);
    }

    .message-card.unread {
      border-left: 4px solid #f9e25e;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 15px;
    }

    .message-from {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .message-from strong {
      font-size: 1.1rem;
      color: #fff;
    }

    .message-from small {
      color: #9fb5d4;
    }

    .message-date {
      color: #9fb5d4;
      font-size: 0.9rem;
    }

    .message-content {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 8px;
      margin: 15px 0;
      line-height: 1.6;
      color: #eef4ff;
      max-height: 150px;
      overflow-y: auto;
    }

    .message-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .action-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-mark {
      background: rgba(79, 123, 255, 0.2);
      color: #4f7bff;
      border: 1px solid rgba(79, 123, 255, 0.4);
    }

    .btn-mark:hover {
      background: rgba(79, 123, 255, 0.3);
    }

    .btn-delete {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    .btn-copy {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .btn-copy:hover {
      background: rgba(34, 197, 94, 0.3);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #9fb5d4;
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #9fb5d4;
    }

    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 16px 24px;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      z-index: 9999;
      animation: slideUp 0.3s ease-out;
    }

    .notification.success {
      background: rgba(34, 197, 94, 0.95);
    }

    .notification.error {
      background: rgba(239, 68, 68, 0.95);
    }

    @keyframes slideUp {
      from {
        transform: translateY(400px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .admin-header {
        flex-direction: column;
        gap: 15px;
      }

      .message-header {
        flex-direction: column;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1><i class="fas fa-inbox"></i> Message Dashboard</h1>
      <button class="refresh-btn" onclick="loadMessages()">
        <i class="fas fa-sync-alt"></i> Refresh
      </button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Messages</h3>
        <div class="value" id="total-count">0</div>
      </div>
      <div class="stat-card">
        <h3>Unread</h3>
        <div class="value" id="unread-count">0</div>
      </div>
      <div class="stat-card">
        <h3>Read</h3>
        <div class="value" id="read-count">0</div>
      </div>
    </div>

    <div class="messages-grid" id="messages-container">
      <div class="loading">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading messages...</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5000';

    async function loadMessages() {
      const container = document.getElementById('messages-container');
      container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i><p>Loading messages...</p></div>';

      try {
        const response = await fetch(`${API_BASE}/api/messages`);
        const data = await response.json();

        if (data.success) {
          const messages = data.data || [];
          displayMessages(messages);
          updateStats(messages);
        } else {
          container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>Error loading messages</p></div>`;
        }
      } catch (error) {
        console.error('Error:', error);
        container.innerHTML = `<div class="empty-state"><i class="fas fa-wifi-slash"></i><p>Cannot connect to backend server</p><p style="font-size: 0.9rem; margin-top: 10px;">Make sure the server is running: npm start</p></div>`;
      }
    }

    function displayMessages(messages) {
      const container = document.getElementById('messages-container');

      if (messages.length === 0) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>No messages yet</p></div>`;
        return;
      }

      container.innerHTML = messages
        .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
        .map(msg => `
        <div class="message-card ${msg.read ? '' : 'unread'}">
          <div class="message-header">
            <div class="message-from">
              <strong>${escapeHtml(msg.name)}</strong>
              <small>${escapeHtml(msg.email)}</small>
            </div>
            <div class="message-date">${formatDate(msg.timestamp)}</div>
          </div>
          <div class="message-content">${escapeHtml(msg.message)}</div>
          <div class="message-actions">
            <button class="action-btn btn-mark" onclick="markAsRead('${msg.id}')">
              <i class="fas fa-check"></i> ${msg.read ? 'Mark Unread' : 'Mark Read'}
            </button>
            <button class="action-btn btn-copy" onclick="copyEmail('${msg.email}')">
              <i class="fas fa-copy"></i> Copy Email
            </button>
            <button class="action-btn btn-delete" onclick="deleteMessage('${msg.id}')">
              <i class="fas fa-trash"></i> Delete
            </button>
          </div>
        </div>
      `).join('');
    }

    function updateStats(messages) {
      const total = messages.length;
      const unread = messages.filter(m => !m.read).length;
      const read = total - unread;

      document.getElementById('total-count').textContent = total;
      document.getElementById('unread-count').textContent = unread;
      document.getElementById('read-count').textContent = read;
    }

    async function markAsRead(id) {
      try {
        const response = await fetch(`${API_BASE}/api/messages/${id}`, {
          method: 'PATCH'
        });
        const data = await response.json();

        if (data.success) {
          showNotification('Status updated', 'success');
          loadMessages();
        }
      } catch (error) {
        showNotification('Error updating message', 'error');
      }
    }

    async function deleteMessage(id) {
      if (confirm('Are you sure you want to delete this message?')) {
        try {
          const response = await fetch(`${API_BASE}/api/messages/${id}`, {
            method: 'DELETE'
          });
          const data = await response.json();

          if (data.success) {
            showNotification('Message deleted', 'success');
            loadMessages();
          }
        } catch (error) {
          showNotification('Error deleting message', 'error');
        }
      }
    }

    function copyEmail(email) {
      navigator.clipboard.writeText(email).then(() => {
        showNotification(`Copied: ${email}`, 'success');
      });
    }

    function formatDate(timestamp) {
      const date = new Date(timestamp);
      const now = new Date();
      const diff = now - date;

      const minutes = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);

      if (minutes < 1) return 'Just now';
      if (minutes < 60) return `${minutes}m ago`;
      if (hours < 24) return `${hours}h ago`;
      if (days < 7) return `${days}d ago`;

      return date.toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
      });
    }

    function escapeHtml(text) {
      const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `notification ${type}`;
      notification.textContent = message;
      document.body.appendChild(notification);

      setTimeout(() => notification.remove(), 3000);
    }

    // Load messages when page loads
    loadMessages();

    // Auto-refresh every 30 seconds
    setInterval(loadMessages, 30000);
  </script>
</body>

</html>
